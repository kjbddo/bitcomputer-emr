# 이름 있는 인메모리 DB(testdb)를 테스트 JVM 전체가 공유하면, 서로 다른 Spring
# 테스트 컨텍스트가 각자 ddl-auto=create-drop 으로 같은 물리 DB 를 껐다 켰다 하게
# 되어 실행 순서에 따라 데이터가 있다 없다 한다(CsrfTest 플레이키 원인 중 하나).
# ${random.uuid} 로 컨텍스트(=Environment)마다 고유한 DB 를 갖게 해 격리한다.
# 같은 설정을 쓰는 테스트 클래스들은 Spring 이 컨텍스트를 캐시해 재사용하므로
# 이 안에서는 여전히 같은 DB 를 공유한다 — 격리 대상은 "서로 다른 컨텍스트 조합" 이다.
spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# RabbitAutoConfiguration 은 제외하지 않는다. ValidationRabbitConfig 가 수동 @Bean 으로
# ConnectionFactory 를 주입받아 RabbitTemplate/리스너 컨테이너를 만들기 때문에, 제외하면
# 그 ConnectionFactory 빈 자체가 없어져 컨텍스트 기동이 실패한다. 브로커가 실제로 없어도
# CachingConnectionFactory 는 연결을 지연(lazy) 시도하므로 테스트 기동은 막지 않는다.

# AppConfig 가 RedisTemplate 을 autoconfigure 가 아닌 수동 @Bean 으로 정의하므로
# 위의 exclude 만으로는 충돌을 막지 못한다. TestRedisConfig 의 목 빈으로 덮어쓴다.
spring.main.allow-bean-definition-overriding=true
spring.data.redis.host=localhost
spring.data.redis.port=6379

jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
auth.cookie.secure=false
cors.allowed-origins=http://localhost:3000
ai.prescription-agent.embed.enabled=false
validation.scheduler.enabled=false

# 이 프로파일에서 test/resources/application.properties 가 main/resources 의
# application.properties 를 클래스패스 우선순위로 가려서, 거기 있던 기본값들이
# 적용되지 않는다. ArangoConfig/AppConfig 가 요구하는 필수 값들을 여기서 직접 채운다.
arangodb.hosts=127.0.0.1:8529
arangodb.user=root
arangodb.password=test
arangodb.database=bitcomputer_graph
gemini.api.key=

# 테스트 환경엔 실 Redis/RabbitMQ 가 없다. actuator 헬스체크가 두 헬스 인디케이터
# 때문에 DOWN(503)이 되지 않도록 끈다 — /actuator/health 자체가 공개인지 확인하는
# 테스트라 이 두 지표는 테스트 관심사가 아니다.
management.health.redis.enabled=false
management.health.rabbit.enabled=false
