# DR(재해 복구) 프로파일 — AI 없이 3-tier 만 세운다.
#
# 이 프로파일은 `docker` 프로파일 위에 얹는다:
#   SPRING_PROFILES_ACTIVE=docker,dr
#
# 뒤에 오는 프로파일이 앞을 덮으므로 순서를 지킨다. `dr` 만 주면 DB·Redis
# 접속 정보가 없어 기동에 실패한다.
#
# 무엇을 위한 구성인가: 진료 기록을 읽고 쓰는 것은 병원이 멈추면 안 되는
# 일이고, 처방 추천과 X-ray 분석은 그렇지 않다. 후자를 빼면 복구 대상이
# 프론트·API·DB 셋으로 줄고 이미지 총량이 14.4GB 에서 4.5GB 가 된다.

# AI 엔드포인트를 503 으로 끊고, RabbitMQ / ArangoDB 배선을 비활성화한다.
# (config/AiFeatures.java, ArangoConfig, ValidationRabbitConfig,
#  ValidationJobResultConsumer 가 이 값을 본다)
features.ai.enabled=false

# RabbitMQ 헬스 인디케이터를 끈다.
#
# **이것을 빠뜨리면 DR 스택이 뜨긴 하는데 /actuator/health 가 503 을 낸다.**
# RabbitTemplate 은 지연 연결이라 빈 생성은 성공하지만, 헬스 인디케이터는
# 실제로 브로커에 붙어 보고 DOWN 을 낸다. 그러면 compose healthcheck 가
# 실패하고 spring-boot 컨테이너가 unhealthy 로 남는다 — 애플리케이션은
# 정상인데 오케스트레이터만 고장으로 읽는 상태가 된다.
management.health.rabbit.enabled=false

# 같은 이유로 Arango 도 끈다. ArangoConfig 가 조건부라 빈이 아예 없지만,
# 클래스패스에 남아 있으면 자동 헬스 인디케이터가 붙을 수 있다.
management.health.arangodb.enabled=false

# RabbitMQ 자동설정은 남긴다.
#
# 지연 연결이라 브로커가 없어도 기동을 막지 않고, AgentServiceImpl 이
# 생성자에서 RabbitTemplate 을 요구하므로 빈 자체는 있어야 한다. 실제 호출은
# 그 앞에서 AiFeatures.requireEnabled() 가 503 으로 끊는다.
#
# 브로커 주소는 닿지 않는 곳을 가리켜도 된다 — 아무도 부르지 않는다.
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq-absent-in-dr}
