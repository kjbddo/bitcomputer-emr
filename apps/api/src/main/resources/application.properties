spring.application.name=BitComputer
spring.jackson.time-zone=Asia/Seoul

# Database Configuration
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:bitcomputer}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# SQL initialization
spring.sql.init.mode=always

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Redis 전용 리포지토리 미사용 시 스캔 비활성화 (JPA/Arango와 혼선·INFO 로그 감소)
spring.data.redis.repositories.enabled=false
#spring.data.redis.password= password

# ArangoDB Configuration
arangodb.hosts=${ARANGO_HOSTS:127.0.0.1:8529}
arangodb.user=${ARANGO_USER:root}
arangodb.password=${ARANGO_PASSWORD}
arangodb.database=${ARANGO_DATABASE:bitcomputer_graph}

# JWT Configuration
jwt.secret=${JWT_SECRET}

# AI API Configuration
# Flask 영상판독 서버(AI_BackEnd/app.py) 전용 base-url
ai.api.base-url=${FLASK_RADIOLOGY_BASE_URL:http://localhost:5000}
ai.api.radiology-path=/api/ai/radiology_report

# 영상판독 엔진 선택: xray | flask
radiology.engine=${RADIOLOGY_ENGINE:xray}
xray.api.base-url=${XRAY_API_BASE_URL:http://localhost:8000}
xray.api.public-base-url=${XRAY_API_PUBLIC_BASE_URL:http://localhost:8000}
xray.api.path=/infer
xray.api.default-view=${XRAY_API_DEFAULT_VIEW:PA}
xray.api.top-k=10

# Python 진단서 에이전트(GraphDB/langchain_graph_qa/certificate_api.py) 전용 base-url
# Flask 영상판독과 포트 충돌을 피하기 위해 5001 로 분리한다.
ai.certificate-agent.base-url=${CERTIFICATE_API_BASE_URL:http://localhost:5001}
ai.certificate-agent.path=/api/ai/document/generate

# Gemini API
gemini.api.key=${GEMINI_API_KEY:}

# RestTemplate: 처방 에이전트(Spring→Python→Gemini) 등 LLM 응답 대기(밀리초)
# 최종 리뷰 IMPORTANT: 이 read-timeout-ms 는 prescription/certificate-api 의
# LLM_GATEWAY_TIMEOUT_SECONDS(기본 180s, infra/.env.example 참고) 보다 짧으면
# 안 된다 — 짧으면 Python 서비스가 게이트웨이 응답을 기다리는 도중 Java 가
# 먼저 연결을 끊는다. apps/web 의 DOCUMENT_API_TIMEOUT_MS
# (apps/web/src/services/agent.ts) 는 반대로 이 값보다 커야 한다.
http.client.rest-template.connect-timeout-ms=5000
http.client.rest-template.read-timeout-ms=180000

# Python prescription agent (FastAPI, GraphDB/langchain_graph_qa/prescription_api.py)
# 추천(/recommend) 은 validation-agent 가 직접 호출한다. Spring 은 피드백 적재에만 쓴다.
ai.prescription-agent.base-url=${PRESCRIPTION_AGENT_BASE_URL:http://localhost:8001}
ai.prescription-agent.feedback-path=/api/agent/prescription/feedback
# Spring 과 함께 uvicorn prescription_api 를 자식 프로세스로 띄울지(로컬 편의). 프로덕션에서는 false 유지.
ai.prescription-agent.embed.enabled=false
ai.prescription-agent.embed.working-directory=../../services/prescription
ai.prescription-agent.embed.python-command=python3
ai.prescription-agent.embed.host=0.0.0.0
ai.prescription-agent.embed.skip-if-healthy=true
ai.prescription-agent.embed.startup-timeout-ms=90000

# Python validation agent (FastAPI + LangGraph)
ai.validation-agent.base-url=${VALIDATION_AGENT_BASE_URL:http://localhost:8002}
ai.validation-agent.path=/api/agent/validation/run
validation.scheduler.enabled=${VALIDATION_SCHEDULER_ENABLED:false}
validation.scheduler.initial-delay-ms=${VALIDATION_SCHEDULER_INITIAL_DELAY_MS:15000}
validation.scheduler.fixed-delay-ms=${VALIDATION_SCHEDULER_FIXED_DELAY_MS:30000}
validation.scheduler.batch-size=${VALIDATION_SCHEDULER_BATCH_SIZE:5}
validation.scheduler.max-retries=${VALIDATION_SCHEDULER_MAX_RETRIES:3}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
validation.rabbitmq.request-queue=${VALIDATION_RABBITMQ_REQUEST_QUEUE:validation.prescription.request}
validation.rabbitmq.result-queue=${VALIDATION_RABBITMQ_RESULT_QUEUE:validation.prescription.result}

# 활성 프로필 (로컬 실행 기본값)
spring.profiles.active=local
# CORS 허용 Origin (쉼표 구분)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# HTTPS 환경에서는 true 로 둔다
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
